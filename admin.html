<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | Guevara Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- مكتبة إنشاء ملفات Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; }
    h2 { margin-bottom: 20px; text-align: center; color: #10b981; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #94a3b8; }
    input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    .btn { width: 100%; padding: 12px; background: #4f46e5; border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #4338ca; }
    .btn-excel { background: #10b981; }
    .btn-excel:hover { background: #059669; }
    .divider { height: 1px; background: #334155; margin: 25px 0; }
  </style>
</head>
<body>

  <div class="container">
    <h2>إضافة منتج جديد للمخزون</h2>
    <form id="add-product-form">
      <div class="form-group">
        <label>اسم المنتج</label>
        <input type="text" id="title" required placeholder="مثال: شيكولاتة ماكس مان">
      </div>

      <div class="form-group">
        <label>السعر (جنيه)</label>
        <input type="number" id="price" required placeholder="250">
      </div>

      <div class="form-group">
        <label>الكمية المتاحة بالمخزون</label>
        <input type="number" id="stock" min="1" value="10" required>
      </div>

      <div class="form-group">
        <label>تفاصيل/وصف المنتج</label>
        <textarea id="desc" rows="3" placeholder="أدخل تفاصيل الوصف أو الألوان أو المقاسات..."></textarea>
      </div>

      <div class="form-group">
        <label>صورة المنتج</label>
        <input type="file" id="image-file" accept="image/*" required>
      </div>

      <button type="submit" class="btn">حفظ وإضافة للمتجر</button>
    </form>

    <div class="divider"></div>

    <h2>إدارة الطلبات والفواتير</h2>
    <p style="font-size:0.85rem; color:#94a3b8; text-align:center; margin-bottom:15px;">
      اضغط لتنزيل ملف Excel بالطلبات وفتح محادثة الواتساب فوراً.
    </p>
    <button class="btn btn-excel" onclick="exportOrdersToExcelAndWhatsApp()">📊 تصدير الفواتير إلى Excel والواتساب</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      databaseURL: "https://guevarastore-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // إضافة منتج جديد
    document.getElementById('add-product-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const file = document.getElementById('image-file').files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const productData = {
          title: document.getElementById('title').value,
          price: parseFloat(document.getElementById('price').value),
          stock: parseInt(document.getElementById('stock').value),
          desc: document.getElementById('desc').value,
          image: evt.target.result
        };

        db.ref('products').push(productData).then(() => {
          alert('تمت إضافة المنتج والمخزون بنجاح!');
          document.getElementById('add-product-form').reset();
        });
      };
      reader.readAsDataURL(file);
    });

    // استخراج الفواتير إلى Excel وفتح الواتساب
    function exportOrdersToExcelAndWhatsApp() {
      // ضع رقم هاتفك مع كود الدولة هنا (مثلاً رقم مصر: 201XXXXXXXXX)
      const myPhoneNumber = "201501008175"; 

      db.ref('orders').once('value').then((snapshot) => {
        const data = snapshot.val();
        if (!data) {
          alert('لا توجد طلبات أو فواتير حتى الآن!');
          return;
        }

        const excelRows = [];
        let totalSales = 0;

        Object.keys(data).forEach((id, index) => {
          const order = data[id];
          totalSales += (order.totalCost || 0);

          excelRows.push({
            "م": index + 1,
            "تاريخ الطلب": order.timestamp ? new Date(order.timestamp).toLocaleString('ar-EG') : '',
            "اسم العميل": order.customerName || '',
            "رقم الهاتف": order.phone || '',
            "العنوان": order.address || '',
            "المنتج": order.productTitle || '',
            "الكمية": order.quantity || 1,
            "إجمالي الفاتورة (ج.م)": order.totalCost || 0
          });
        });

        // 1. إنشاء وتحميل ملف Excel
        const worksheet = XLSX.utils.json_to_sheet(excelRows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "الطلبات والفواتير");
        
        // حفظ الملف باسم orders.xlsx
        XLSX.writeFile(workbook, "فواتير_متجر_جيفارة.xlsx");

        // 2. تحضير الرسالة وفتح الواتساب
        const message = `تقرير الفواتير والطلبات - متجر جيفارة 🛒%0A` +
                        `إجمالي عدد الطلبات: ${excelRows.length}%0A` +
                        `إجمالي المبيعات: ${totalSales} ج.م%0A` +
                        `تم تحميل ملف Excel التفصيلي على الهاتف.`;

        const waUrl = `https://wa.me/${myPhoneNumber}?text=${message}`;
        
        setTimeout(() => {
          window.open(waUrl, '_blank');
        }, 1000);
      });
    }
  </script>
</body>
</html>
