<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر جيفارا | Guevara Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: #f8fafc; color: #1e293b; }
    header { background: #0f172a; color: #fff; padding: 20px; text-align: center; font-size: 1.5em; font-weight: bold; }
    
    /* شريط الأقسام */
    .category-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x: auto; white-space: nowrap; }
    .cat-btn { padding: 8px 18px; border: 1px solid #cbd5e1; border-radius: 20px; background: #fff; color: #475569; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .cat-btn.active, .cat-btn:hover { background: #0284c7; color: #fff; border-color: #0284c7; }

    /* شبكة المنتجات */
    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; }
    .card-desc { color: #64748b; font-size: 0.85em; margin-bottom: 10px; height: 38px; overflow: hidden; }
    .card-price { color: #0284c7; font-size: 1.2em; font-weight: bold; margin-bottom: 10px; }
    .btn-buy { width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-buy:hover { background: #059669; }

    /* نافذة الطلب */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #fff; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; }
    .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
    .modal-content input:focus { border-color: #0284c7; }
  </style>
</head>
<body>

  <header>متجر جيفارا 🛒</header>

  <!-- شريط الأقسام -->
  <div class="category-bar">
    <button class="cat-btn active" onclick="filterProducts('الكل', this)">الكل</button>
    <button class="cat-btn" onclick="filterProducts('منتجات حريمي', this)">منتجات حريمي</button>
    <button class="cat-btn" onclick="filterProducts('منتجات رجالي', this)">منتجات رجالي</button>
    <button class="cat-btn" onclick="filterProducts('أخرى', this)">أخرى</button>
  </div>

  <div class="container">
    <div class="products-grid" id="grid"></div>
  </div>

  <!-- نافذة الشراء -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <h3 id="modalTitle">إتمام الطلب</h3>
      <p id="modalPrice" style="color:#0284c7; font-weight:bold; margin-bottom:10px;"></p>
      <input type="text" id="custName" placeholder="الاسم بالكامل" required>
      <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
      <input type="text" id="custAddress" placeholder="العنوان التفصيلي" required>
      <button class="btn-buy" id="submitOrderBtn" style="margin-top:10px;" onclick="submitOrder()">تأكيد الطلب</button>
      <button style="width:100%; padding:8px; margin-top:5px; background:none; border:none; color:#ef4444; cursor:pointer;" onclick="closeModal()">إلغاء</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://guevara-store-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allProducts = {};
    let selectedProduct = null;
    let currentCategory = 'الكل';

    // جلب المنتجات
    onValue(ref(db, 'products'), (snapshot) => {
      allProducts = snapshot.val() || {};
      renderProducts(currentCategory);
    });

    window.renderProducts = function(category) {
      currentCategory = category;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const keys = Object.keys(allProducts);
      let count = 0;

      keys.forEach(key => {
        const item = allProducts[key];
        if (category === 'الكل' || item.category === category) {
          count++;
          const card = document.createElement('div');
          card.className = 'card';
          
          // حماية البيانات من قيم undefined
          const safeTitle = (item.title || '').replace(/'/g, "\\'");
          const safePrice = item.price || 0;

          card.innerHTML = `
            <img src="${item.image || 'https://via.placeholder.com/200'}" alt="${safeTitle}">
            <div class="card-body">
              <div>
                <div class="card-title">${item.title || ''}</div>
                <div class="card-desc">${item.description || ''}</div>
              </div>
              <div>
                <div class="card-price">${safePrice} ج.م</div>
                <button class="btn-buy" onclick="openOrderModal('${safeTitle}', '${safePrice}')">شراء الآن</button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        }
      });

      if (count === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:30px;">لا توجد منتجات متوفرة في هذا القسم حالياً.</p>';
      }
    };

    window.filterProducts = function(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      renderProducts(cat);
    };

    window.openOrderModal = function(title, price) {
      selectedProduct = { title, price };
      document.getElementById('modalTitle').innerText = "طلب: " + title;
      document.getElementById('modalPrice').innerText = "السعر: " + price + " ج.م";
      document.getElementById('orderModal').style.display = 'flex';
    };

    window.closeModal = function() {
      document.getElementById('orderModal').style.display = 'none';
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custAddress').value = '';
    };

    window.submitOrder = function() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const btn = document.getElementById('submitOrderBtn');

      if(!name || !phone || !address) {
        alert('برجاء ملء جميع البيانات');
        return;
      }

      btn.innerText = "جاري إرسال الطلب...";
      btn.disabled = true;

      push(ref(db, 'orders'), {
        customerName: name,
        phone: phone,
        address: address,
        productTitle: selectedProduct.title,
        productPrice: selectedProduct.price,
        date: new Date().toLocaleString('ar-EG')
      }).then(() => {
        alert('تم إرسال طلبك بنجاح! وسنتواصل معك قريباً 🎉');
        btn.innerText = "تأكيد الطلب";
        btn.disabled = false;
        closeModal();
      }).catch((err) => {
        alert('حدث خطأ أثناء إرسال الطلب: ' + err.message);
        btn.innerText = "تأكيد الطلب";
        btn.disabled = false;
      });
    };
  </script>
</body>
</html>
