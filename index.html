<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guevara Store | متجر جيفارة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #10b981;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(79,70,229,0.5); }
    .logo span { color: var(--accent); }

    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

    .hero-banner {
      background: linear-gradient(45deg, rgba(79,70,229,0.2), rgba(16,185,129,0.2));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: rgba(0,0,0,0.2);
    }

    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .desc { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4; }
    
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .price { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
    .stock-tag { font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; background: rgba(255,255,255,0.1); }
    .stock-tag.out { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    /* Modal / Modal Checkout */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-sub); }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      outline: none;
    }

    .invoice-box {
      background: rgba(0,0,0,0.2);
      border: 1px dashed var(--card-border);
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      font-size: 0.9rem;
    }

    .invoice-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .invoice-total { border-top: 1px solid var(--card-border); pt: 6px; font-weight: 800; color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="logo">GUEVARA <span>STORE</span></div>
  </header>

  <div class="container">
    <div class="hero-banner">
      <h2>مرحباً بك في متجر جيفارة</h2>
      <p style="color: var(--text-sub); font-size:0.9rem; margin-top:5px;">تسوق أفضل المنتجات بأعلى جودة وأفضل سعر</p>
    </div>

    <div id="products-grid" class="grid">
      <p style="text-align:center; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
    </div>
  </div>

  <!-- نافذة شراء المودال -->
  <div id="checkout-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">إتمام الطلب</h3>
      <form id="order-form">
        <input type="hidden" id="prod-id">
        <input type="hidden" id="prod-price">

        <div class="form-group">
          <label>المنتج المختار</label>
          <input type="text" id="prod-title" readonly style="opacity: 0.7;">
        </div>

        <div class="form-group">
          <label>الكمية المطلوبة</label>
          <input type="number" id="prod-qty" min="1" value="1" onchange="updateInvoice()">
        </div>

        <div class="form-group">
          <label>الاسم بالكامل</label>
          <input type="text" id="cust-name" required placeholder="أدخل اسمك الثلاثي">
        </div>

        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="tel" id="cust-phone" required placeholder="01XXXXXXXXX">
        </div>

        <div class="form-group">
          <label>المحافظة / العنوان بالتفصيل</label>
          <input type="text" id="cust-address" required placeholder="أدخل العنوان بالتفصيل">
        </div>

        <!-- معاينة الفاتورة للعميل -->
        <div class="invoice-box">
          <div class="invoice-row">
            <span>سعر القطعة:</span>
            <span id="inv-unit-price">0 ج.م</span>
          </div>
          <div class="invoice-row">
            <span>إجمالي المنتجات:</span>
            <span id="inv-subtotal">0 ج.م</span>
          </div>
          <div class="invoice-row">
            <span>مصاريف الشحن:</span>
            <span id="inv-shipping">50 ج.م</span>
          </div>
          <div class="invoice-row invoice-total">
            <span>الإجمالي النهائي:</span>
            <span id="inv-total">0 ج.م</span>
          </div>
        </div>

        <button type="submit" class="btn" style="background: var(--accent);">تأكيد إرسال الطلب</button>
        <button type="button" class="btn" onclick="closeModal()" style="background: transparent; border: 1px solid var(--card-border); margin-top: 8px;">إلغاء</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    // إعدادات Firebase
    const firebaseConfig = {
      databaseURL: "https://guevarastore-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentStock = 0;

    // جلب المنتجات من القاعدة
    db.ref('products').on('value', (snapshot) => {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد منتجات معروضة حالياً.</p>';
        return;
      }

      Object.keys(data).forEach(id => {
        const item = data[id];
        const stock = item.stock || 0;
        const isAvailable = stock > 0;

        grid.innerHTML += `
          <div class="card">
            <img src="${item.image || 'https://via.placeholder.com/300'}" alt="${item.title}">
            <div class="card-body">
              <div>
                <div class="title">${item.title}</div>
                <div class="desc">${item.desc || 'لا يوجد وصف متاح.'}</div>
              </div>
              <div>
                <div class="price-row">
                  <div class="price">${item.price} ج.م</div>
                  <div class="stock-tag ${!isAvailable ? 'out' : ''}">
                    ${isAvailable ? 'المتاح: ' + stock : 'نفذت الكمية'}
                  </div>
                </div>
                <button class="btn" ${!isAvailable ? 'disabled' : ''} onclick="openCheckout('${id}', '${item.title}', ${item.price}, ${stock})">
                  ${isAvailable ? 'طلب المنتج' : 'غير متوفر'}
                </button>
              </div>
            </div>
          </div>
        `;
      });
    });

    function openCheckout(id, title, price, stock) {
      currentStock = stock;
      document.getElementById('prod-id').value = id;
      document.getElementById('prod-title').value = title;
      document.getElementById('prod-price').value = price;
      
      const qtyInput = document.getElementById('prod-qty');
      qtyInput.value = 1;
      qtyInput.max = stock;

      updateInvoice();
      document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    function updateInvoice() {
      const price = parseFloat(document.getElementById('prod-price').value) || 0;
      let qty = parseInt(document.getElementById('prod-qty').value) || 1;

      if (qty > currentStock) {
        qty = currentStock;
        document.getElementById('prod-qty').value = currentStock;
      }

      const shipping = 50; // مصاريف الشحن الثابتة
      const subtotal = price * qty;
      const total = subtotal + shipping;

      document.getElementById('inv-unit-price').innerText = price + ' ج.م';
      document.getElementById('inv-subtotal').innerText = subtotal + ' ج.م';
      document.getElementById('inv-shipping').innerText = shipping + ' ج.م';
      document.getElementById('inv-total').innerText = total + ' ج.م';
    }

    // إرسال الطلب وحسم المخزون
    document.getElementById('order-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const prodId = document.getElementById('prod-id').value;
      const qty = parseInt(document.getElementById('prod-qty').value);
      const price = parseFloat(document.getElementById('prod-price').value);
      const shipping = 50;
      const totalCost = (price * qty) + shipping;

      const orderData = {
        productTitle: document.getElementById('prod-title').value,
        quantity: qty,
        totalCost: totalCost,
        customerName: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        address: document.getElementById('cust-address').value,
        timestamp: new Date().toISOString()
      };

      // حفظ الطلب
      db.ref('orders').push(orderData).then(() => {
        // خصم الكمية من المخزون
        const newStock = currentStock - qty;
        db.ref('products/' + prodId).update({ stock: newStock });

        alert('تم إرسال طلبك بنجاح! وسنتواصل معك قريباً.');
        closeModal();
        document.getElementById('order-form').reset();
      });
    });
  </script>
</body>
</html>
